<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>AI Document Scanner V3.1</title>

    <link rel="stylesheet" href="style.css?v=31">
</head>

<body>

<main class="container">

    <h1>AI Document Scanner</h1>

    <p class="instruction">
        Chọn ảnh rồi dùng ngón tay khoanh vùng mã cần đọc.
    </p>

    <input
        type="file"
        id="imageInput"
        accept="image/*"
    >

    <div id="imageArea">
        <img id="sourceImage" alt="Ảnh đã chọn">

        <div id="selectionBox"></div>
    </div>

    <p id="selectionInfo">
        Chưa chọn vùng.
    </p>

    <button id="ocrButton" disabled>
        🔍 Đọc vùng đã chọn
    </button>

    <p id="status"></p>

    <textarea
        id="ocrResult"
        rows="8"
        placeholder="Kết quả OCR sẽ xuất hiện ở đây..."
        readonly
    ></textarea>

</main>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

<script src="app.js?v=31"></script>

</body>
</html>
