<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI Document Scanner</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">

        <h1>AI Document Scanner</h1>

        <p>Chọn một ảnh để bắt đầu OCR</p>

        <input
            type="file"
            id="imageInput"
            accept="image/*"
        >

        <div id="preview"></div>

        <div id="info"></div>

        <button id="ocrButton" disabled>
            🔍 Đọc chữ trong ảnh
        </button>

        <p id="status"></p>

        <textarea
            id="ocrResult"
            placeholder="Kết quả OCR sẽ xuất hiện ở đây..."
            rows="10"
        ></textarea>

    </main>

    <!-- Tesseract OCR -->
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

    <script src="app.js"></script>

</body>
</html>
